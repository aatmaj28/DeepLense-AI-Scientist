name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint + offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check src/dlens tests

      - name: Tests (fully offline — mock model + mock backend)
        run: uv run pytest
