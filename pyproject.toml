[project]
name = "dlens"
version = "0.1.0"
description = "DLens – DeepLense AI Scientist framework"
readme = "README.md"
authors = [
    { name = "Pranath Reddy Kumbam", email = "pranath.mail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "llama-cpp-python>=0.3.16",
    "loguru>=0.7.3",
    "matplotlib>=3.8",
    "mcp>=1.26.0",
    "numba>=0.63.1",
    "numpy>=1.26",
    "outlines>=1.2.9",
    "pandas>=3.0.0",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.48.0",
    "requests>=2.32.5",
    "xmltodict>=1.0.2",
]

[project.optional-dependencies]
# Heavy, version-pinned scientific stack required ONLY for the real DeepLens
# simulation backend. The framework is fully runnable/testable without these via
# the mock backend (see dlens.tools.get_backend).
deeplense = [
    "lenstronomy==1.9.2",
    "colossus>=1.3",
    # pyHalo is installed from source (see README) — not pinned-compatible on PyPI.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
# Collect only the test suite (the example scripts under scripts/ are not tests
# and connect to live models at import time).
testpaths = ["tests"]
filterwarnings = [
    # pydantic-ai's run_sync/get_event_loop deprecation, surfaced via the framework.
    "ignore:There is no current event loop:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
